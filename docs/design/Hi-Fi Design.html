<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>麻雀部スコア管理 — 高解像度デザイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  // Tailwind 設定（Next.js への移植時はこの内容を tailwind.config.ts へ）
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper:   '#fafaf7',
          surface: '#ffffff',
          line:    '#e8e5dc',
          'line-strong': '#d4d1c8',
          ink: {
            1: '#1a1a1a',
            2: '#52524d',
            3: '#9a978f',
          },
          felt: {
            DEFAULT: '#0e5a3c',
            soft:    '#e8f0eb',
            deep:    '#0a4530',
          },
          neg: {
            DEFAULT: '#c8312b',
            soft:    '#fbeae8',
          },
          gold: {
            DEFAULT: '#a8893a',
            soft:    '#f5eed8',
          },
        },
        fontFamily: {
          sans: ['"Noto Sans JP"', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        boxShadow: {
          card:  '0 1px 2px rgba(20,18,12,.04), 0 1px 1px rgba(20,18,12,.03)',
          pop:   '0 4px 16px rgba(20,18,12,.08), 0 1px 2px rgba(20,18,12,.04)',
        },
        borderRadius: {
          sm: '6px',
          DEFAULT: '8px',
          md: '10px',
          lg: '14px',
        },
      }
    }
  };
</script>
<style>
  html,body { background:#e8e4dc; margin:0; padding:0; }
  body { font-family:'Noto Sans JP', system-ui, sans-serif; color:#1a1a1a; }
  .num { font-family:'JetBrains Mono', ui-monospace, monospace; font-feature-settings:"tnum"; }
  /* 麻雀牌風アイコン (再利用) */
  .pai{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:30px; background:#fdfbf4; color:#1a1a1a;
    border:1px solid #d4d1c8; border-radius:3px 3px 4px 4px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.06);
    font-weight:600; font-size:14px; line-height:1;
  }
  .pai.lg{ width:32px; height:42px; font-size:18px; border-radius:4px 4px 6px 6px; }
  .pai.red{ color:#c8312b; }
  .pai.green{ color:#0e5a3c; }
  .pai.gold{ color:#a8893a; }
  /* underline link */
  .ulink{ text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness:1px; }
  /* subtle felt gradient — used only on score input table */
  .felt-bg{
    background:
      radial-gradient(circle at 30% 20%, rgba(255,255,255,.06), transparent 60%),
      linear-gradient(180deg, #0f6043, #0a4530);
  }
  /* tiny dotted divider */
  .dotline{
    background-image: linear-gradient(90deg, #d4d1c8 50%, transparent 50%);
    background-size: 6px 1px; background-repeat: repeat-x; background-position: 0 50%;
    height:1px; width:100%;
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="hifi-components.jsx"></script>
<script type="text/babel" src="hifi-screens-main.jsx"></script>
<script type="text/babel" src="hifi-screens-admin.jsx"></script>
<script type="text/babel" src="hifi-screens-misc.jsx"></script>
<script type="text/babel" src="hifi-mobile.jsx"></script>
<script type="text/babel" src="hifi-app.jsx"></script>

</html>
