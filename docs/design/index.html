<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>麻雀部スコア管理 — ワイヤーフレーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Zen+Kurenaido&family=Yomogi&family=Klee+One:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  html, body { margin:0; padding:0; background:#e8e4dc; }
  body { font-family: "Zen Kurenaido", "Klee One", sans-serif; color:#1a1a1a; }
  /* Wireframe primitives — reused by all artboards */
  :root{
    --paper:#f4ece0;
    --ink:#1a1a1a;
    --ink-2:#3a342c;
    --ink-3:#7a7368;
    --line:#1a1a1a;
    --felt:#0e5a3c;
    --felt-2:#0a4a30;
    --red:#c8312b;
    --gold:#a8893a;
    --hand: "Zen Kurenaido", "Klee One", "Yomogi", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, monospace;
  }
  .wf {
    width:100%; height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--hand);
    overflow:hidden;
    position:relative;
    box-sizing:border-box;
  }
  /* paper texture via tiny noise */
  .wf::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    background-image:
      radial-gradient(rgba(0,0,0,.04) 1px, transparent 1px),
      radial-gradient(rgba(0,0,0,.025) 1px, transparent 1px);
    background-size: 3px 3px, 7px 7px;
    background-position: 0 0, 1px 2px;
    opacity:.6;
  }
  .wf *{ box-sizing:border-box; }
  .ink { border:1.5px solid var(--ink); }
  .ink-d { border:1.5px dashed var(--ink); }
  .ink-thin { border:1px solid var(--ink); }
  .hatch {
    background-image: repeating-linear-gradient(
      -45deg, rgba(0,0,0,.18) 0 1px, transparent 1px 6px);
  }
  .hatch-red {
    background-image: repeating-linear-gradient(
      -45deg, rgba(200,49,43,.5) 0 1px, transparent 1px 6px);
  }
  .hatch-green {
    background-image: repeating-linear-gradient(
      -45deg, rgba(14,90,60,.45) 0 1px, transparent 1px 6px);
  }
  .scribble {
    background-image: repeating-linear-gradient(
      0deg, transparent 0 6px, rgba(0,0,0,.5) 6px 7px);
    background-size: 100% 7px;
  }
  .mono { font-family:var(--mono); font-feature-settings:"tnum"; }
  .label { font-family:var(--mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-2); }
  .stamp{
    display:inline-flex; align-items:center; justify-content:center;
    border:1.5px solid var(--red); color:var(--red);
    padding:2px 8px; border-radius:3px; font-family:var(--hand);
    transform: rotate(-3deg); letter-spacing:.05em;
  }
  .btn{
    display:inline-flex; align-items:center; justify-content:center;
    border:1.5px solid var(--ink); background:var(--paper);
    padding:6px 14px; font-family:var(--hand); font-size:14px;
    box-shadow: 2px 2px 0 var(--ink);
    cursor:pointer; user-select:none;
  }
  .btn.primary{ background:var(--felt); color:#f4ece0; }
  .btn.danger{ background:var(--red); color:#f4ece0; }
  .chip{
    display:inline-flex; align-items:center; gap:4px;
    border:1.2px solid var(--ink); padding:1px 7px; border-radius:10px;
    font-size:11px; font-family:var(--hand);
  }
  .chip.red{ border-color:var(--red); color:var(--red); }
  .chip.green{ border-color:var(--felt); color:var(--felt); background:rgba(14,90,60,.06); }
  .tile{
    /* 麻雀牌っぽいモチーフ */
    width:22px; height:30px;
    background:#fdfbf4;
    border:1.5px solid var(--ink);
    border-radius:3px 3px 4px 4px;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.12), 1.5px 1.5px 0 var(--ink);
    display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--hand); font-size:14px;
    color:var(--ink);
  }
  .tile.red{ color:var(--red); }
  .tile.green{ color:var(--felt); }
  /* hand-drawn underline */
  .uline{
    background-image: linear-gradient(transparent 92%, var(--ink) 92% 96%, transparent 96%);
  }
  /* tiny corner bracket frame */
  .frame{
    position:relative;
  }
  .frame::before, .frame::after,
  .frame > .br::before, .frame > .br::after{
    content:""; position:absolute; width:10px; height:10px;
    border:1.5px solid var(--ink);
  }
  .frame::before{ top:-2px; left:-2px; border-right:0; border-bottom:0;}
  .frame::after{ top:-2px; right:-2px; border-left:0; border-bottom:0;}
  .frame > .br{position:absolute; inset:0; pointer-events:none;}
  .frame > .br::before{ bottom:-2px; left:-2px; border-right:0; border-top:0;}
  .frame > .br::after{ bottom:-2px; right:-2px; border-left:0; border-top:0;}

  /* simple SVG bar/line containers reuse base color */
  .axis{ stroke:var(--ink); stroke-width:1; fill:none; }
  .bar{ fill:var(--felt); }
  .bar.alt{ fill:var(--red); }
  .ln{ fill:none; stroke:var(--felt); stroke-width:1.8; }
  .dot{ fill:var(--paper); stroke:var(--felt); stroke-width:1.5; }

  /* toggle (hand-drawn) */
  .toggle{
    display:inline-flex; align-items:center; gap:6px;
    font-family:var(--hand); font-size:12px;
  }
  .toggle .track{
    width:38px; height:18px; border:1.5px solid var(--ink); border-radius:10px;
    position:relative; background:var(--paper);
  }
  .toggle .knob{
    position:absolute; top:1px; left:1px; width:14px; height:14px;
    border-radius:50%; background:var(--ink);
  }
  .toggle.on .track{ background:rgba(14,90,60,.18); }
  .toggle.on .knob{ left:21px; background:var(--felt); }

  /* tabs */
  .tabs{ display:flex; gap:0; border-bottom:1.5px solid var(--ink); }
  .tab{
    padding:6px 14px; border:1.5px solid var(--ink); border-bottom:0;
    background:var(--paper); margin-bottom:-1.5px; font-family:var(--hand);
    border-radius:6px 6px 0 0; margin-right:4px; font-size:13px;
  }
  .tab.active{ background:var(--ink); color:var(--paper); }

  /* sidebar nav item */
  .nav-item{
    display:flex; align-items:center; gap:8px;
    padding:8px 10px; border-radius:4px; font-family:var(--hand);
    font-size:13px; color:var(--ink);
  }
  .nav-item.active{ background:var(--ink); color:var(--paper); }
  .nav-item .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }

  /* table */
  table.wf-tbl{ width:100%; border-collapse:collapse; font-family:var(--hand); font-size:12px; }
  table.wf-tbl th, table.wf-tbl td{
    padding:6px 8px; border-bottom:1px dashed var(--ink); text-align:left;
  }
  table.wf-tbl th{
    border-bottom:1.5px solid var(--ink); font-weight:400;
    font-family:var(--mono); font-size:9px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--ink-2);
  }
  table.wf-tbl td.num{ font-family:var(--mono); text-align:right; }
  table.wf-tbl tr:hover td{ background:rgba(0,0,0,.03); }

  /* margin-note style annotation */
  .note{
    font-family:"Yomogi", var(--hand);
    color:var(--red); font-size:11px; line-height:1.3;
    display:inline-flex; align-items:flex-start; gap:3px;
  }
  .note::before{ content:"↳"; }

  /* placeholder photo box */
  .ph{
    display:flex; align-items:center; justify-content:center;
    border:1.5px solid var(--ink); background:#efe7d8;
    font-family:var(--mono); font-size:9px; color:var(--ink-2);
    position:relative; overflow:hidden;
  }
  .ph::before{
    content:""; position:absolute; inset:0;
    background:
      linear-gradient(135deg, transparent calc(50% - 1px), var(--ink) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(45deg, transparent calc(50% - 1px), var(--ink) calc(50% - 1px) calc(50% + 1px), transparent calc(50% + 1px));
    opacity:.25;
  }
  .ph > span{ position:relative; background:rgba(244,236,224,.85); padding:1px 4px;}

  /* tiny callouts */
  .ann{
    position:absolute; font-family:"Yomogi", var(--hand);
    color:var(--red); font-size:11px; line-height:1.2;
  }
  .ann svg{ display:block; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="wireframes-primitives.jsx"></script>
<script type="text/babel" src="wireframes-screens.jsx"></script>
<script type="text/babel" src="wireframes-mobile.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
</body>
</html>
