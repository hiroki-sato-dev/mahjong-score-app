<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>麻雀部スコア管理 — コンポーネント設計</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          paper:'#fafaf7', surface:'#ffffff',
          line:'#e8e5dc', 'line-strong':'#d4d1c8',
          ink:    { 1:'#1a1a1a', 2:'#52524d', 3:'#9a978f' },
          felt:   { DEFAULT:'#0e5a3c', soft:'#e8f0eb', deep:'#0a4530' },
          neg:    { DEFAULT:'#c8312b', soft:'#fbeae8' },
          gold:   { DEFAULT:'#a8893a', soft:'#f5eed8' },
        },
        fontFamily: {
          sans:['"Noto Sans JP"','system-ui','sans-serif'],
          mono:['"JetBrains Mono"','ui-monospace','monospace'],
        },
        boxShadow:{
          card:'0 1px 2px rgba(20,18,12,.04), 0 1px 1px rgba(20,18,12,.03)',
          pop:'0 4px 16px rgba(20,18,12,.08), 0 1px 2px rgba(20,18,12,.04)',
        },
      }
    }
  };
</script>
<style>
  html,body { background:#fafaf7; margin:0; padding:0; }
  body { font-family:'Noto Sans JP', system-ui, sans-serif; color:#1a1a1a; }
  .num { font-family:'JetBrains Mono', ui-monospace, monospace; font-feature-settings:"tnum"; }
  .pai{
    display:inline-flex; align-items:center; justify-content:center;
    width:22px; height:30px; background:#fdfbf4; color:#1a1a1a;
    border:1px solid #d4d1c8; border-radius:3px 3px 4px 4px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.06);
    font-weight:600; font-size:14px; line-height:1;
  }
  .pai.lg{ width:32px; height:42px; font-size:18px; border-radius:4px 4px 6px 6px; }
  .pai.red{ color:#c8312b; }
  .pai.green{ color:#0e5a3c; }
  .pai.gold{ color:#a8893a; }

  /* code block style */
  .code{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:12px; line-height:1.65;
    background:#0e0f10; color:#e2e0d6; border-radius:8px;
    padding:14px 16px;
    overflow:auto;
    border:1px solid #1a1a1a;
  }
  .code .k{ color:#c890ff; }  /* keyword */
  .code .s{ color:#9be3a7; }  /* string */
  .code .c{ color:#7a7368; font-style:italic; } /* comment */
  .code .t{ color:#6cd0e6; }  /* type */
  .code .p{ color:#e7c97a; }  /* prop */
  .code .n{ color:#f6a89a; }  /* number / literal */

  .tree{
    font-family:'JetBrains Mono', ui-monospace, monospace;
    font-size:12.5px; line-height:1.9;
    color:#1a1a1a;
    white-space:pre;
  }
  .tree .dim{ color:#9a978f; }
  .tree .acc{ color:#0e5a3c; font-weight:600; }
  .tree .meta{ color:#a8893a; }

  /* link anchor offset */
  :target { scroll-margin-top: 24px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="hifi-components.jsx"></script>
<script type="text/babel" src="handoff-app.jsx"></script>
</body>
</html>
